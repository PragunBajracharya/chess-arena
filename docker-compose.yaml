services:
  postgres:
    image: postgres:17-alphine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=value
      - POSTGRES_PASSWORD=value
      - POSTGRES_DB=chess
    ports:
      - "5432:5432"
    volume:
      - pgdata:/var/lib/postgresql/data
  
  redis:
    image: resid:7-alphine
    restart: unless-stopped
    ports:
      - "6379:6379"
    

volumes:
  pgddata